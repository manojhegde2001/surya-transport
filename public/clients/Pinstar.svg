<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%">
  <defs>
    <!-- Metallic champagne gold gradient -->
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB" />
      <stop offset="40%" stop-color="#F8B500" />
      <stop offset="70%" stop-color="#E5A60D" />
      <stop offset="100%" stop-color="#C58900" />
    </linearGradient>

    <!-- Star bevel highlights -->
    <linearGradient id="pStarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="100%" stop-color="#E2A60A" />
    </linearGradient>
    <linearGradient id="pStarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CF9208" />
      <stop offset="100%" stop-color="#8C5E00" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- THE PROMINENT LETTER 'P' -->
    <path fill="url(#pGold)" fill-rule="evenodd" d="
      M 25,32 
      L 33,20 
      L 45,20 
      L 38,32 
      L 105,32
      C 126,32 136,52 136,65
      C 136,78 126,98 105,98
      L 45,98
      L 45,160
      L 25,160
      Z
      M 45,46
      L 100,46
      C 112,46 118,55 118,65
      C 118,75 112,84 100,84
      L 45,84
      Z
    " />

    <!-- 'IN' NESTED DIRECTLY UNDER THE LOOP OF 'P' -->
    <!-- Letter 'I' -->
    <rect x="54" y="108" width="13" height="52" fill="url(#pGold)" />

    <!-- Letter 'N' -->
    <path fill="url(#pGold)" d="
      M 75,108 
      L 88,108 
      L 106,144 
      L 106,108 
      L 118,108 
      L 118,160 
      L 105,160 
      L 87,124 
      L 87,160 
      L 75,160 
      Z
    " />

    <!-- THE 5-POINTED STAR WITH 3D BEVEL AND CENTER CUTOUT -->
    <!-- Right star facets -->
    <polygon fill="url(#pStarRight)" points="
      188,40 
      202,84 
      248,88 
      212,116 
      226,160 
      188,134
    " />

    <!-- Left star facets -->
    <polygon fill="url(#pStarLeft)" points="
      188,40 
      188,134 
      150,160 
      164,116 
      128,88 
      174,84
    " />

    <!-- Center keyhole / curved shadow cutout -->
    <path fill="#0B132B" opacity="0.85" d="
      M 188,72 
      C 181,85 180,110 188,128 
      C 183,116 182,90 192,78 
      Z
    " />
  </g>
</svg>
